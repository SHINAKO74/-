function isKeigo(w) {
  return (w.cat || '') === 'noun';
}
function isKyo(w) {
  return (w.cat || '') === 'verb';
}
function isKango(w) {
  // A: wordが漢字のみ
  return (w.cat || '') === 'adjective';
}
function setFilter(f) { listFilter = f; render(); }

function fmtDue(c) {
  if (c.phase === 'new') return '—';
  const diff = c.due - Date.now();
  if (diff <= 0) return 'now';
  if (diff < 60*MIN) return Math.max(1, Math.round(diff/MIN)) + 'm';
  if (diff < DAY) return Math.round(diff/(60*MIN)) + 'h';
  return Math.round(diff/DAY) + 'd';
}

function phaseLabel(p) {
  return { new:'新出', learning:'学習中', review:'復習', mastered:'習得', retired:'永久習得' }[p];
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'たった今';
  if (mins < 60) return mins + '分前';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + '時間前';
  const days = Math.floor(hrs / 24);
  return days + '日前';
}

function renderStats() {
  updateStats();
  const area = document.getElementById('card-area');
  const s = getStats();

  // === Streak ===
  const streakHtml = `
    <div class="panel">
      <h2 class="panel-title">連 続 学 習 <span class="panel-title-en">streak</span></h2>
      <div class="streak-grid">
        <div class="streak-cell">
          <div class="streak-num shu">${state.streak.current}</div>
          <div class="streak-cell-label">現在 (日)</div>
        </div>
        <div class="streak-cell">
          <div class="streak-num gold">${state.streak.longest}</div>
          <div class="streak-cell-label">最長 (日)</div>
        </div>
        <div class="streak-cell">
          <div class="streak-num">${state.totalReviews}</div>
          <div class="streak-cell-label">総復習</div>
        </div>
      </div>
    </div>
  `;

  // === Mastery progress ===
  const masteryPct = WORDS.length > 0 ? Math.round((s.masteredC / WORDS.length) * 100) : 0;
  const studiedC = WORDS.length - s.newC;
  const studiedPct = WORDS.length > 0 ? Math.round((studiedC / WORDS.length) * 100) : 0;
  const segmentBars = Array(10).fill(0).map(() => '<div></div>').join('');
  const masteryHtml = `
    <div class="panel">
      <h2 class="panel-title">習 得 進 捗 <span class="panel-title-en">mastery</span></h2>
      <div class="progress-track">
        <div class="progress-fill" style="width:${masteryPct}%;"></div>
        <div class="progress-segments">${segmentBars}</div>
      </div>
      <div class="progress-meta">
        <span><b>${s.masteredC}</b> / ${WORDS.length} 習得</span>
        <span>${masteryPct}%</span>
      </div>
      <div class="stats-sub">
        着手済み: ${studiedC} 語 (${studiedPct}%)
      </div>
    </div>
  `;

  // === Phase distribution ===
  const total = WORDS.length;
  const phasePct = (n) => total > 0 ? (n / total) * 100 : 0;
  const phaseHtml = `
    <div class="panel">
      <h2 class="panel-title">状 態 内 訳 <span class="panel-title-en">phase distribution</span></h2>
      <div class="phase-bar">
        ${s.newC > 0 ? `<div class="phase-seg new" style="flex:${phasePct(s.newC)};">${s.newC}</div>` : ''}
        ${s.learnC > 0 ? `<div class="phase-seg learning" style="flex:${phasePct(s.learnC)};">${s.learnC}</div>` : ''}
        ${(WORDS.length - s.newC - s.learnC - s.masteredC) > 0 ? `<div class="phase-seg review" style="flex:${phasePct(WORDS.length - s.newC - s.learnC - s.masteredC)};">${WORDS.length - s.newC - s.learnC - s.masteredC}</div>` : ''}
        ${s.masteredC > 0 ? `<div class="phase-seg mastered" style="flex:${phasePct(s.masteredC)};">${s.masteredC}</div>` : ''}
      </div>
      <div class="phase-legend">
        <div class="phase-legend-item"><div class="dot new"></div>新出 ${s.newC}</div>
        <div class="phase-legend-item"><div class="dot learning"></div>学習中 ${s.learnC}</div>
        <div class="phase-legend-item"><div class="dot review"></div>復習 ${WORDS.length - s.newC - s.learnC - s.masteredC}</div>
        <div class="phase-legend-item"><div class="dot mastered"></div>習得 ${s.masteredC}</div>
      </div>
    </div>
  `;

  // === Heatmap (last 13 weeks = 91 days) ===
  const HM_DAYS = 91;
  const today = new Date();
  today.setHours(0,0,0,0);
  const cells = [];
  let maxDay = 0;
  for (let i = HM_DAYS - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const k = dateKey(d);
    const h = state.history[k];
    const n = h ? h.reviews : 0;
    if (n > maxDay) maxDay = n;
    cells.push({ date: d, key: k, n });
  }
  const levelOf = (n) => {
    if (n === 0) return 0;
    if (n <= 5) return 1;
    if (n <= 15) return 2;
    if (n <= 30) return 3;
    return 4;
  };
  const cellsHtml = cells.map(c => {
    const lv = levelOf(c.n);
    const tip = `${c.date.getMonth()+1}/${c.date.getDate()}・${c.n}回`;
    const ariaLabel = `${c.date.getMonth()+1}月${c.date.getDate()}日: ${c.n}回の復習`;
    return `<div class="hm-cell ${lv?'l'+lv:''}" data-tip="${tip}" title="${tip}" role="img" aria-label="${ariaLabel}" onclick="document.getElementById('hm-tip').textContent=this.dataset.tip"></div>`;
  }).join('');
  const heatmapHtml = `
    <div class="panel">
      <h2 class="panel-title">学 習 履 歴 <span class="panel-title-en">last 13 weeks</span></h2>
      <div class="heatmap">${cellsHtml}</div>
      <div id="hm-tip" class="hm-tip"></div>
      <div class="hm-scale">
        少 <div class="hm-cell"></div>
        <div class="hm-cell l1"></div>
        <div class="hm-cell l2"></div>
        <div class="hm-cell l3"></div>
        <div class="hm-cell l4"></div>
        多
      </div>
    </div>
  `;

  // === Forecast (next 7 days due) — review/mastered only ===
  const now = Date.now();
  const buckets = Array(7).fill(0);
  WORDS.forEach(w => {
    const c = state.cards[w.id];
    if (c.phase !== 'review' && c.phase !== 'mastered') return;
    const diff = c.due - now;
    const dayIdx = Math.floor(diff / DAY);
    if (dayIdx < 0) buckets[0] += 1;
    else if (dayIdx < 7) buckets[dayIdx] += 1;
  });
  const fcMax = Math.max(...buckets, 1);
  const dayLabels = ['今日','+1','+2','+3','+4','+5','+6'];
  const fcHtml = `
    <div class="panel">
      <h2 class="panel-title">復 習 予 測 <span class="panel-title-en">next 7 days</span></h2>
      <div class="forecast">
        ${buckets.map((n, i) => `
          <div class="fc-col">
            <div class="fc-bar-wrap">
              <div class="fc-bar ${n===0?'zero':''}" style="height:${(n/fcMax)*100}%;" data-val="${n}"></div>
            </div>
            <div class="fc-label">${dayLabels[i]}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // === Difficult words ===
  const studied = WORDS.filter(w => {
    const c = state.cards[w.id];
    return c.phase !== 'new' && (c.lapses > 0 || c.reps > 0);
  });
  studied.sort((a,b) => {
    const ca = state.cards[a.id], cb = state.cards[b.id];
    const sa = ca.lapses * 3 - ca.ease + (ca.reps > 0 ? ca.lapses / ca.reps : 0);
    const sb = cb.lapses * 3 - cb.ease + (cb.reps > 0 ? cb.lapses / cb.reps : 0);
    return sb - sa;
  });
  const top = studied.slice(0, 5);
  const hardHtml = `
    <div class="panel">
      <h2 class="panel-title">苦 手 な 語 <span class="panel-title-en">hardest 5</span></h2>
      ${top.length === 0 ? '<div class="stats-empty">まだデータがありません</div>' :
        '<div class="hard-list">' + top.map((w, i) => {
          const c = state.cards[w.id];
          const meaningShort = (w.ja || '').replace(/・.*$/,'').slice(0,22);
          const rate = c.reps > 0 ? Math.round((c.lapses / (c.reps + c.lapses)) * 100) : 0;
          return `
            <div class="hard-row" role="button" tabindex="0" onclick="openWordModal(${w.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openWordModal(${w.id})}" aria-label="${i+1}位 ${w.en}, 失敗 ${c.lapses}回, 失敗率 ${rate}パーセント">
              <div class="hard-rank" aria-hidden="true">${i+1}</div>
              <div>
                <div class="hard-word" lang="en">${w.en}</div>
                <div class="hard-meaning">${meaningShort}</div>
              </div>
              <div class="hard-stat" aria-hidden="true">
                失敗 <b>${c.lapses}</b> / ${rate}%<br>
                ease ${c.ease.toFixed(2)}
              </div>
            </div>
          `;
        }).join('') + '</div>'
      }
      <div style="margin-top:12px;text-align:right">
        <button class="memo-action-btn" onclick="openEaseModal()" type="button" style="font-size:11px">
          苦手な語をすべて見る →
        </button>
      </div>
    </div>
  `;

  // === Recent reviews (last 30) ===
  const recent = WORDS
    .filter(w => state.cards[w.id].lastReviewedAt > 0)
    .sort((a,b) => state.cards[b.id].lastReviewedAt - state.cards[a.id].lastReviewedAt)
    .slice(0, 30);
  const recentHtml = `
    <div class="panel">
      <h2 class="panel-title">最 近 の 学 習 <span class="panel-title-en">recent ${recent.length}</span></h2>
      ${recent.length === 0 ? '<div class="stats-empty">まだ学習していません</div>' :
        '<div class="recent-list">' + recent.map(w => {
          const c = state.cards[w.id];
          const meaningShort = (w.ja || '').replace(/・.*$/,'').slice(0,20);
          return `
            <div class="recent-item" role="button" tabindex="0" onclick="openWordModal(${w.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openWordModal(${w.id})}" aria-label="${w.en} ${meaningShort} ${phaseLabel(c.phase)} ${timeAgo(c.lastReviewedAt)}">
              <span class="recent-word">${w.en}</span>
              <span class="recent-meaning">${meaningShort}</span>
              <span class="card-phase ${c.phase} recent-phase">${phaseLabel(c.phase)}</span>
              <span class="recent-time">${timeAgo(c.lastReviewedAt)}</span>
            </div>
          `;
        }).join('') + '</div>'
      }
    </div>
  `;

  area.innerHTML = `
    <div class="stats-wrap">
      ${streakHtml}
      ${masteryHtml}
      ${phaseHtml}
      ${fcHtml}
      ${heatmapHtml}
      ${hardHtml}
      ${recentHtml}
    </div>
  `;
}

function renderList() {
  updateStats();
  const area = document.getElementById('card-area');
  let words = WORDS.slice();

  // ④ AND検索: スペース区切りで複数語 → 全て含む単語のみ
  const terms = searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (terms.length) {
    words = words.filter(w =>
      terms.every(t =>
        (w.en || '').toLowerCase().includes(t) ||
        (w.ja || '').toLowerCase().includes(t) ||
        (w.pos || '').toLowerCase().includes(t) ||
        (w.ph || '').toLowerCase().includes(t)
      )
    );

    // 関連度スコアリング: 完全一致 > 前方一致 > 部分一致
    // 複数termの場合は最初のtermで単語列の一致度を計算
    const primary = terms[0];
    words.sort((a, b) => {
      const wa = a.word.toLowerCase(), wb = b.word.toLowerCase();
      const score = w => {
        if (w === primary) return 3;           // 完全一致
        if (w.startsWith(primary)) return 2;  // 前方一致
        return 1;                              // 部分一致
      };
      const diff = score(wb) - score(wa);
      if (diff !== 0) return diff;
      return a.id - b.id; // 同スコアは収録順
    });
  }

  // ③ マッチ箇所ハイライト
  function highlightTerms(text) {
    let html = escapeHtml(text);
    if (!terms.length) return html;
    terms.forEach(t => {
      const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      html = html.replace(re, m => `<mark>${escapeHtml(m)}</mark>`);
    });
    return html;
  }

  // phase / memo / keigo filter
  if (listFilter === 'memo') {
    words = words.filter(w => !!getMemo(w.id));
  } else if (listFilter === 'etym_fav') {
    words = words.filter(w => etymFavs.has(w.en));
  } else if (listFilter === 'keigo') {
    words = words.filter(w => isKeigo(w));
  } else if (listFilter === 'kyo') {
    words = words.filter(w => isKyo(w));
  } else if (listFilter === 'kango') {
    words = words.filter(w => isKango(w));
  } else if (listFilter !== 'all') {
    words = words.filter(w => state.cards[w.id].phase === listFilter);
  }

  // sort（検索中はスコア順優先のため既存ソートをスキップ）
  if (!terms.length) {
    if (sortMode === 'index') {
    words.sort((a,b) => a.id - b.id);
  } else if (sortMode === 'phase') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      const order = { learning: 0, review: 1, new: 2, mastered: 3 };
      if (order[ca.phase] !== order[cb.phase]) return order[ca.phase] - order[cb.phase];
      return ca.due - cb.due;
    });
  } else if (sortMode === 'aiueo') {
    words.sort((a,b) => a.en.localeCompare(b.en, 'en'));
  } else if (sortMode === 'difficulty') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      const da = ca.lapses * 2 - ca.ease;
      const db = cb.lapses * 2 - cb.ease;
      return db - da;
    });
  } else if (sortMode === 'due') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      if (ca.phase === 'new' && cb.phase !== 'new') return 1;
      if (cb.phase === 'new' && ca.phase !== 'new') return -1;
      return ca.due - cb.due;
    });
  }
  } // end !terms.length sort block

  const counts = {
    all: WORDS.length,
    new: WORDS.filter(w => state.cards[w.id].phase === 'new').length,
    learning: WORDS.filter(w => state.cards[w.id].phase === 'learning').length,
    review: WORDS.filter(w => state.cards[w.id].phase === 'review').length,
    mastered: WORDS.filter(w => state.cards[w.id].phase === 'mastered' || state.cards[w.id].phase === 'retired').length,
    memo: WORDS.filter(w => !!getMemo(w.id)).length,
    etym_fav: WORDS.filter(w => etymFavs.has(w.en)).length,
    keigo: WORDS.filter(w => isKeigo(w)).length,
    kyo:   WORDS.filter(w => isKyo(w)).length,
    kango: WORDS.filter(w => isKango(w)).length,
  };

  // ② 件数表示テキスト
  const isFiltered = terms.length > 0 || listFilter !== 'all';
  const countText = isFiltered ? `${words.length} 件` : '';

  const rows = words.map(w => {
    const cs = state.cards[w.id];
    const idx = WORDS.findIndex(x => x.id === w.id) + 1;
    const meaningShort = (w.ja || '').replace(/・.*$/,'').slice(0,28);
    const metaText = cs.phase === 'new' ? 'new' : `i${cs.interval} · ${fmtDue(cs)}`;
    const phaseText = phaseLabel(cs.phase);
    const wordHtml    = highlightTerms(w.en);
    const meaningHtml = highlightTerms(meaningShort);
    return `
      <div class="row" role="button" tabindex="0" onclick="openWordModal(${w.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openWordModal(${w.id})}" aria-label="${w.en}, ${meaningShort}, 状態 ${phaseText}">
        <div class="row-num" aria-hidden="true">${String(idx).padStart(2,'0')}</div>
        <div>
          <div class="row-word" lang="en">${wordHtml}${getMemo(w.id)?'<span class="row-memo-dot" title="メモあり"></span>':''}</div>
          <div class="row-meaning">${meaningHtml}</div>
        </div>
        <div class="row-status">
          <div class="row-meta" aria-hidden="true">${metaText}</div>
          <div class="dot ${cs.phase}" aria-hidden="true"></div>
        </div>
      </div>`;
  }).join('');

  // Check if list shell already exists (to preserve search input during IME)
  const existingRows = area.querySelector('#list-rows');
  if (existingRows) {
    // Only update rows + filter counts + result count — don't touch search input
    existingRows.innerHTML = rows || (searchQuery.trim() ? `<div class="no-results">「${escapeHtml(searchQuery.trim())}」に一致する単語はありません</div>` : '<div class="no-results">該当する単語がありません</div>');
    const countEl = area.querySelector('#list-count');
    if (countEl) countEl.textContent = countText;
    // Update filter button counts
    const filterBtns = area.querySelectorAll('.list-filter button');
    const countVals = [counts.all, counts.new, counts.learning, counts.review, counts.mastered, counts.memo, counts.keigo, counts.kyo, counts.kango];
    const countKeys = ['all', 'new', 'learning', 'review', 'mastered', 'memo', 'keigo', 'kyo', 'kango'];
    const countLabels = ['すべて','新出','学習中','復習','習得','✏ メモあり','★ 語源お気に入り','名詞','動詞','形容詞'];
    filterBtns.forEach((btn, i) => {
      btn.textContent = countLabels[i] + ' ' + countVals[i];
      btn.className = listFilter === countKeys[i] ? 'active' : '';
      btn.setAttribute('aria-pressed', listFilter === countKeys[i]);
    });
    return;
  }

  // First render: create full list shell
  area.innerHTML = `
    <div class="list">
      <div class="controls">
        <label class="sr-only" for="search-input">英単語検索</label>
        <input id="search-input" class="search-input" type="search" placeholder="検索 (word・意味・pos)" value="${searchQuery.replace(/"/g,'&quot;')}" oninput="onSearchInput(this)" oncompositionstart="searchComposing=true" oncompositionend="onSearchCompositionEnd(this)" onblur="searchComposing=false" aria-label="英単語を検索">
        <label class="sr-only" for="sort-select">並び替え</label>
        <select id="sort-select" class="sort-select" onchange="setSort(this.value)" aria-label="並び替え">
          <option value="index" ${sortMode==='index'?'selected':''}>収録順</option>
          <option value="aiueo" ${sortMode==='aiueo'?'selected':''}>A→Z順</option>
          <option value="phase" ${sortMode==='phase'?'selected':''}>状態順</option>
          <option value="due" ${sortMode==='due'?'selected':''}>期限順</option>
          <option value="difficulty" ${sortMode==='difficulty'?'selected':''}>難易度順</option>
        </select>
      </div>
      <div class="list-filter" role="group" aria-label="状態フィルター">
        <button class="${listFilter==='all'?'active':''}" onclick="setFilter('all')" aria-pressed="${listFilter==='all'}" type="button">すべて ${counts.all}</button>
        <button class="${listFilter==='new'?'active':''}" onclick="setFilter('new')" aria-pressed="${listFilter==='new'}" type="button">新出 ${counts.new}</button>
        <button class="${listFilter==='learning'?'active':''}" onclick="setFilter('learning')" aria-pressed="${listFilter==='learning'}" type="button">学習中 ${counts.learning}</button>
        <button class="${listFilter==='review'?'active':''}" onclick="setFilter('review')" aria-pressed="${listFilter==='review'}" type="button">復習 ${counts.review}</button>
        <button class="${listFilter==='mastered'?'active':''}" onclick="setFilter('mastered')" aria-pressed="${listFilter==='mastered'}" type="button">習得 ${counts.mastered}</button>
        <button class="${listFilter==='memo'?'active':''}" onclick="setFilter('memo')" aria-pressed="${listFilter==='memo'}" type="button">✏ メモあり ${counts.memo}</button>
        <button class="${listFilter==='etym_fav'?'active':''}" onclick="setFilter('etym_fav')" aria-pressed="${listFilter==='etym_fav'}" type="button">★ 語源お気に入り ${counts.etym_fav}</button>
        <button class="${listFilter==='keigo'?'active':''}" onclick="setFilter('keigo')" aria-pressed="${listFilter==='keigo'}" type="button">名詞 ${counts.keigo}</button>
        <button class="${listFilter==='kyo'?'active':''}" onclick="setFilter('kyo')" aria-pressed="${listFilter==='kyo'}" type="button">動詞 ${counts.kyo}</button>
        <button class="${listFilter==='kango'?'active':''}" onclick="setFilter('kango')" aria-pressed="${listFilter==='kango'}" type="button">形容詞 ${counts.kango}</button>
      </div>
      <div id="list-count" class="list-count">${countText}</div>
      <div id="list-rows">${rows || (searchQuery.trim() ? `<div class="no-results">「${escapeHtml(searchQuery.trim())}」に一致する単語はありません</div>` : '<div class="no-results">該当する単語がありません</div>')}</div>
      <div class="legend">
        <div class="legend-item"><div class="dot new"></div>新出</div>
        <div class="legend-item"><div class="dot learning"></div>学習中</div>
        <div class="legend-item"><div class="dot review"></div>復習</div>
        <div class="legend-item"><div class="dot mastered"></div>習得</div>
      </div>
    </div>
  `;

  if (searchFocused) {
    const inp = area.querySelector('.search-input');
    if (inp) {
      inp.focus();
      const len = inp.value.length;
      inp.setSelectionRange(len, len);
    }
  }
}

let searchFocused = false;
let searchDebounce = null;
let searchComposing = false;
function onSearchInput(el) {
  if (searchComposing) return;
  searchQuery = el.value;
  searchFocused = true;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { renderList(); }, 300);
}
function onSearchCompositionEnd(el) {
  searchComposing = false;
  searchQuery = el.value;
  searchFocused = true;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { renderList(); }, 50);
}
function setSort(v) { sortMode = v; renderList(); }

function render() {
  if (currentView === 'list') { renderList(); return; }
  if (currentView === 'stats') { renderStats(); return; }
  searchFocused = false;
  updateStats();
  const area = document.getElementById('card-area');

  const wasNull = !currentCard;
  if (!currentCard) {
    currentCard = pickNextCard();
    currentDirection = pickDirection();
    cardStage = 0;
    showingDetail = false;
    if (currentCard && settings.ttsEnabled) speakWord(currentCard.en);
  }

  if (!currentCard) {
    const s = getStats();
    const d = state.daily;
    const msg = (d.newDone >= settings.newLimit && s.newC > 0)
      ? 'Daily new word limit reached.'
      : 'All done for today.';
    area.innerHTML = `
      <div class="card">
        <div class="empty">
          <div class="empty-icon">✦</div>
          <div class="empty-title">${msg}</div>
          <div>Check back later for more reviews.</div>
        </div>
      </div>`;
    return;
  }

  if (showingDetail) {
    renderQuizDetail();
    return;
  }

  renderCardFace();
}

function rateSkipCheck(good) {
  if (!currentCard) return;
  const c = state.cards[currentCard.id];
  const now = Date.now();

  if (good) {
    // スキップ成功：review フェーズへ、interval=12日、0.2カウント
    c.phase = 'review';
    c.interval = fuzzInterval(12);
    c.due = now + c.interval * DAY;
    c.reps += 1;
    c.skipTested = true;
    c.quizPassed = true;
    c.lastReviewedAt = now;
    state.lastShownId = currentCard.id;
    state.daily.newDone += 0.2;
    recordReview(false);
    sfxEasy();
  } else {
    // スキップ失敗：new のまま、skipTested=true、due=1分後
    // newDone は通常フロー（rate()のwasNew判定）で+1される
    c.skipTested = true;
    c.due = now + MIN;
    c.lastReviewedAt = now;
    state.lastShownId = currentCard.id;
    recordReview(true);
    sfxAgain();
  }

  saveState();
  currentCard = null;
  cardStage = 0;
  showingDetail = false;
  render();
}

// =============== FIRST-ENCOUNTER QUIZ ===============
let quizState = null; // { word, options, correctIdx, answeredIdx, isCorrect }

function shortenMeaning(m, random) {
  // 多義語（・区切り）のとき、random=trueならランダムに1つ選ぶ
  const parts = m.split('・').map(p => p.trim()).filter(Boolean);
  let s;
  if (random && parts.length > 1) {
    s = parts[Math.floor(Math.random() * parts.length)];
  } else {
    s = parts[0];
  }
  if (s.length > 38) s = s.slice(0, 36) + '…';
  return s;
}

// Extract keywords for similarity check
function meaningKeywords(m) {
  return m.replace(/[・、。\s\/]+/g, ' ')
    .split(' ')
    .map(k => k.replace(/する$|な$|の$/, '').trim())
    .filter(k => k.length >= 2);
}

// Check if two meanings are too similar to use as distractors
function meaningOverlaps(a, b) {
  const kwA = meaningKeywords(a);
  const kwB = meaningKeywords(b);
  // 完全一致キーワードが1つでもあれば除外（長さ問わず）
  if (kwA.some(ka => kwB.includes(ka))) return true;
  // 3文字以上のキーワードが部分一致でも除外
  if (kwA.some(ka => ka.length >= 3 && kwB.some(kb => kb.includes(ka) || ka.includes(kb)))) return true;
  return false;
}

function buildQuizOptions(targetWord) {
  const correctMeaning = shortenMeaning(targetWord.ja, true); // 多義語はランダム選択
  // Pick 3 distractors: prefer same pos, but exclude words with overlapping meanings
  const samePos = WORDS.filter(w => w.id !== targetWord.id && w.pos === targetWord.pos);
  const others  = WORDS.filter(w => w.id !== targetWord.id && w.pos !== targetWord.pos);
  const pool = [...shuffle(samePos), ...shuffle(others)];
  const seenMeanings = new Set([correctMeaning]);
  const distractors = [];
  for (const w of pool) {
    const m = shortenMeaning(w.ja, true);
    if (seenMeanings.has(m)) continue;
    // 短縮後と元meaning両方でオーバーラップチェック
    if (meaningOverlaps(correctMeaning, m)) continue;
    if (meaningOverlaps(targetWord.ja, w.ja)) continue;
    seenMeanings.add(m);
    distractors.push(m);
    if (distractors.length === 3) break;
  }
  const options = shuffle([correctMeaning, ...distractors]);
  return { options, correctIdx: options.indexOf(correctMeaning) };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuizFace() {
  const area = document.getElementById('card-area');
  const w = currentCard;
  if (!w) { render(); return; }
  const c = state.cards[w.id];
  if (!c) { render(); return; }

  if (!quizState || quizState.wordId !== w.id) {
    const built = buildQuizOptions(w);
    quizState = {
      wordId: w.id,
      options: built.options,
      correctIdx: built.correctIdx,
      answeredIdx: null,
      isCorrect: null,
      dontKnow: false,
    };
  }

  const answered = quizState.answeredIdx !== null || quizState.dontKnow;

  const optsHtml = quizState.options.map((opt, i) => {
    let cls = 'quiz-opt';
    if (answered) {
      if (i === quizState.correctIdx) cls += ' correct';
      else if (i === quizState.answeredIdx) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="answerQuiz(${i})" ${answered?'disabled':''} type="button">
      <span class="quiz-opt-num">${'①②③④'[i]}</span><span>${opt}</span>
    </button>`;
  }).join('');

  const dontKnowHtml = answered ? '' : `
    <button class="quiz-opt dontknow" onclick="answerQuiz(-1)" type="button">わからない</button>
  `;

  let resultHtml = '';
  let continueHtml = '';
  if (answered) {
    if (quizState.isCorrect) {
      resultHtml = `<div class="quiz-result">正解。「${w.en}」=${shortenMeaning(w.ja)}</div>`;
    } else if (quizState.dontKnow) {
      resultHtml = `<div class="quiz-result wrong">「${w.en}」=${shortenMeaning(w.ja)}<br><small class="text-muted">焦らずいきましょう</small></div>`;
    } else {
      resultHtml = `<div class="quiz-result wrong">不正解。正しくは「${w.en}」=${shortenMeaning(w.ja)}</div>`;
    }
    const btnLabel = (!quizState.isCorrect && !settings.showDetailOnWrong) ? '次 へ' : '詳 細 を 見 る';
    continueHtml = `<button class="quiz-continue" onclick="finishQuiz()" type="button">${btnLabel}</button>`;
  }

  area.innerHTML = `
    <div class="card">
      ${cardHeaderHtml(c, wordIdx(w), {badge: c.phase === 'new' ? '初出 4択' : '再確認 4択', mb8: true})}
      <div class="word-pos">${w.pos}</div>
      <div class="word-jp" onclick="event.stopPropagation();speakWord('${w.en.replace(/'/g,"\'")}')" style="cursor:pointer;font-size:${wordFontSize(w.en)}" title="クリックで読み上げ">${w.en}</div>
      ${w.ph ? `<div class="word-ph">${escapeHtml(w.ph)}</div>` : ''}
      <div class="quiz-prompt">意 味 は ど れ か</div>
      <div class="quiz-options">
        ${optsHtml}
        ${dontKnowHtml}
      </div>
      ${resultHtml}
      ${continueHtml}
    </div>
  `;
}

function answerQuiz(idx) {
  if (!quizState) return;
  if (quizState.answeredIdx !== null || quizState.dontKnow) return; // 二重回答防止
  if (idx === -1) {
    quizState.dontKnow = true;
    quizState.isCorrect = false;
    sfxAgain();
  } else {
    quizState.answeredIdx = idx;
    quizState.isCorrect = (idx === quizState.correctIdx);
    if (quizState.isCorrect) sfxGood(); else sfxAgain();
  }
  renderQuizFace();
}

function finishQuiz() {
  if (!currentCard || !quizState) return;
  const c = state.cards[currentCard.id];
  const wasNew = c.phase === 'new';
  const wasReview = c.phase === 'review' || c.phase === 'mastered';
  const wasCorrect = !!quizState.isCorrect;
  const q = wasCorrect ? 2 : 0;
  applyRating(c, q);
  // learning/review降格後は次回フラッシュカードで出す（クイズループ防止）
  c.quizPassed = true;
  c.lastReviewedAt = Date.now();
  state.lastShownId = currentCard.id;
  if (wasNew) state.daily.newDone += 1;
  else if (wasReview) state.daily.reviewDone += 1;
  recordReview(wasNew);
  saveState();
  quizState = null;

  if (!wasCorrect && !settings.showDetailOnWrong) {
    currentCard = null;
    cardStage = 0;
    render();
    return;
  }

  renderQuizDetail();
}

function renderQuizDetail() {
  showingDetail = true;
  const area = document.getElementById('card-area');
  const w = currentCard;
  if (!w) { render(); return; }
  const c = state.cards[w.id];
  if (!c) { render(); return; }

  area.innerHTML = `
    <div class="stage-card" id="quiz-detail">
      ${cardHeaderHtml(c, wordIdx(w), {})}
      <div class="word-pos">${w.pos}</div>
      <div class="word-jp">${w.en}</div>
      ${w.ph ? `<div class="word-ph">${escapeHtml(w.ph)}</div>` : ''}
      <div class="meaning-block mt-14">
        <div class="meaning-label">Meaning</div>
        <div class="meaning-text">${w.ja}</div>
      </div>
      <div class="mt-14">${wordInfoHtml(w)}</div>
      ${memoEditHtml(w.id)}
      <button class="quiz-continue mt-auto" onclick="advanceFromDetail()" type="button">次 へ</button>
    </div>
  `;
}

function advanceFromDetail() {
  showingDetail = false;
  autoSaveMemo();
  currentCard = null;
  cardStage = 0;
  render();
}


// Stage-based card state (Lexicon-style)
let cardStage = 0; // 0=word only, 1=full reveal
const STAGE_COUNT = 2;

function renderCardFace() {
  const area = document.getElementById('card-area');
  const w = currentCard;
  if (!w) { render(); return; }
  const c = state.cards[w.id];
  if (!c) { render(); return; }

  // Skip-mode confirmation test: new card, not yet skip-tested (上限チェック付き)
  if (settings.skipMode && c.phase === 'new' && !c.skipTested && state.daily.newDone < settings.newLimit) {
    renderSkipCheckFace();
    return;
  }

  if (!c.quizPassed) {
    renderQuizFace();
    return;
  }

  const dirTag = currentDirection === 'word2meaning' ? 'word → meaning'
               : currentDirection === 'example2word' ? 'example → word'
               : 'meaning → word';
  const fullyOpen = cardStage >= 1;

  // Stage progress dots (2 dots)
  const dots = Array.from({length: STAGE_COUNT}, (_, i) =>
    `<div class="stage-dot ${i < cardStage ? 'passed' : i === cardStage ? 'active' : ''}"></div>`
  ).join('');

  // === Stage 0: prompt ===
  let stage0;
  if (currentDirection === 'example2word') {
    const ex  = (w.exEn  || '').trim();
    const hl  = '';
    const displayed = highlightExample(ex, hl);
    stage0 = `
      <div class="stage-section">
        <div class="word-pos">${w.pos}</div>
        <div class="example-prompt">${displayed}</div>
        <div class="tap-hint-sub">Review: check the meaning of the highlighted word in the example</div>
      </div>
    `;
  } else if (currentDirection === 'word2meaning') {
    stage0 = `
      <div class="stage-section">
        <div class="word-pos">${w.pos}</div>
        <div class="word-jp" onclick="event.stopPropagation();speakWord('${w.en.replace(/'/g,"\'")}')" style="cursor:pointer;font-size:${wordFontSize(w.en)}" title="クリックで読み上げ">${w.en}</div>
        ${w.ph ? `<div class="word-ph">${escapeHtml(w.ph)}</div>` : ''}
      </div>
    `;
  } else {
    stage0 = `
      <div class="stage-section">
        <div class="word-pos">${w.pos}</div>
        <div class="meaning-prompt">${w.ja}</div>
      </div>
    `;
  }

  // === Stage 1: full reveal ===
  let stage1 = '';
  if (cardStage >= 1) {
    let revealTop;
    if (currentDirection === 'example2word') {
      revealTop = `
        <div class="text-center">
          <div class="word-back">${w.en}</div>
          ${w.ph ? `<div class="word-ph">${escapeHtml(w.ph)}</div>` : ''}
          <div class="word-back-pos">${w.pos}</div>
        </div>
        <div class="meaning-block">
          <div class="meaning-label">Meaning</div>
          <div class="meaning-text">${w.ja}</div>
        </div>
      `;
    } else if (currentDirection === 'word2meaning') {
      revealTop = `
        <div class="meaning-block">
          <div class="meaning-label">Meaning</div>
          <div class="meaning-text">${w.ja}</div>
        </div>
      `;
    } else {
      revealTop = `
        <div class="text-center">
          <div class="word-back">${w.en}</div>
          ${w.ph ? `<div class="word-ph">${escapeHtml(w.ph)}</div>` : ''}
          <div class="word-back-pos">${w.pos}</div>
        </div>
      `;
    }

    stage1 = `
      <div class="stage-section mt-14">
        ${revealTop}
        <div class="mt-14">${wordInfoHtml(w)}</div>
        ${memoEditHtml(w.id)}
      </div>
    `;
  }

  // Footer
  let footer;
  if (!fullyOpen) {
    footer = `<div class="tap-hint mt-auto">tap / space to reveal</div>`;
  } else {
    footer = `
      <div class="ratings two-btn mt-auto" role="group" aria-label="評価">
        <button class="rate-btn" data-q="0" onclick="rate(0)" aria-label="あし(忘れた)、次回は${previewInterval(c,0)}後" type="button"><span class="jp" aria-hidden="true">あし</span><span class="interval" aria-hidden="true">${previewInterval(c,0)}</span></button>
        <button class="rate-btn" data-q="2" onclick="rate(2)" aria-label="よし、次回は${previewInterval(c,2)}後" type="button"><span class="jp" aria-hidden="true">よし</span><span class="interval" aria-hidden="true">${previewInterval(c,2)}</span></button>
      </div>
    `;
  }

  area.innerHTML = `
    <div class="stage-card" id="stage-card">
      <span class="swipe-indicator left" id="swipe-left">あし</span>
      <span class="swipe-indicator right" id="swipe-right">よし</span>
      ${cardHeaderHtml(c, wordIdx(w), {dirTag})}
      <div class="stage-progress" aria-hidden="true">${dots}</div>
      ${stage0}
      ${stage1}
      ${footer}
    </div>
  `;

  attachStageInteractions();
}

let swipeAbort = null; // AbortController for document-level swipe listeners

function attachStageInteractions() {
  const card = document.getElementById('stage-card');
  if (!card) return;

  // Clean up previous document-level listeners
  if (swipeAbort) { swipeAbort.abort(); swipeAbort = null; }

  // Tap-to-advance (only on the card surface, not on rate buttons / chips)
  card.addEventListener('click', (e) => {
    if (e.target.closest('.rate-btn')) return;
    if (e.target.closest('.chip')) return;
    if (e.target.closest('.memo-block')) return;
    if (cardStage < STAGE_COUNT - 1) {
      advanceStage();
    }
  });

  // Swipe handling (only when fully open)
  if (cardStage < STAGE_COUNT - 1) return;

  swipeAbort = new AbortController();
  const signal = swipeAbort.signal;

  let startX = 0, startY = 0, currentX = 0, dragging = false;
  const SWIPE_THRESHOLD = 90;

  function onStart(e) {
    if (e.target.closest('.rate-btn') || e.target.closest('.chip')) return;
    if (e.target.closest('.memo-block')) return;
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX;
    startY = t.clientY;
    currentX = 0;
    dragging = true;
    card.classList.add('dragging');
  }
  function onMove(e) {
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dy) > Math.abs(dx) * 1.4 && Math.abs(dy) > 10) {
      dragging = false;
      card.classList.remove('dragging');
      card.style.transform = '';
      const sl = document.getElementById('swipe-left');
      const sr = document.getElementById('swipe-right');
      if (sl) sl.classList.remove('show');
      if (sr) sr.classList.remove('show');
      return;
    }
    if (e.cancelable && Math.abs(dx) > 8) e.preventDefault();
    currentX = dx;
    const rot = dx * 0.05;
    card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    const sl = document.getElementById('swipe-left');
    const sr = document.getElementById('swipe-right');
    if (sl) sl.classList.toggle('show', dx < -30);
    if (sr) sr.classList.toggle('show', dx > 30);
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    const isSkipCheck = settings.skipMode && currentCard &&
      state.cards[currentCard.id].phase === 'new' && !state.cards[currentCard.id].skipTested;
    if (currentX < -SWIPE_THRESHOLD) {
      card.classList.add('swipe-left');
      if (isSkipCheck) setTimeout(() => rateSkipCheck(false), 180);
      else setTimeout(() => rate(0), 180);
    } else if (currentX > SWIPE_THRESHOLD) {
      card.classList.add('swipe-right');
      if (isSkipCheck) setTimeout(() => rateSkipCheck(true), 180);
      else setTimeout(() => rate(2), 180);
    } else {
      card.style.transform = '';
      const sl = document.getElementById('swipe-left');
      const sr = document.getElementById('swipe-right');
      if (sl) sl.classList.remove('show');
      if (sr) sr.classList.remove('show');
    }
  }

  card.addEventListener('touchstart', onStart, { passive: true });
  card.addEventListener('touchmove', onMove, { passive: false });
  card.addEventListener('touchend', onEnd);
  card.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove, { signal });
  document.addEventListener('mouseup', onEnd, { signal });
}

function advanceStage() {
  if (cardStage >= STAGE_COUNT - 1) return;
  const c = currentCard && state.cards[currentCard.id];
  // クイズ中は stage 不変。ただしスキップ確認テスト中は通す。
  if (c && !c.quizPassed && !(settings.skipMode && c.phase === 'new' && !c.skipTested)) return;
  autoSaveMemo();
  cardStage += 1;
  sfxFlip();
  renderCardFace();
}

function rate(q) {
  if (!currentCard) return;
  autoSaveMemo();
  const c = state.cards[currentCard.id];
  const wasNew = c.phase === 'new';
  const wasReview = c.phase === 'review' || c.phase === 'mastered';

  if (q === 0) sfxAgain();
  else if (q === 1) sfxHard();
  else if (q === 2) sfxGood();
  else if (q === 3) sfxEasy();

  applyRating(c, q);
  // 不正解時は次回クイズを要求
  if (q === 0) c.quizPassed = false;
  c.lastReviewedAt = Date.now();
  state.lastShownId = currentCard.id;

  if (wasNew) state.daily.newDone += 1;
  else if (wasReview) state.daily.reviewDone += 1;

  recordReview(wasNew);

  saveState();
  currentCard = null;
  render();
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (document.querySelector('.modal-overlay')) return;

  // Tab arrow navigation when focus is on a tab
  if (e.target.getAttribute('role') === 'tab') {
    const tabs = ['tab-study','tab-list','tab-stats'];
    const idx = tabs.indexOf(e.target.id);
    if (idx === -1) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const next = e.key === 'ArrowRight' ? (idx + 1) % tabs.length : (idx - 1 + tabs.length) % tabs.length;
      const view = next === 0 ? 'study' : next === 1 ? 'list' : 'stats';
      switchView(view);
      document.getElementById(tabs[next]).focus();
      return;
    }
    if (e.key === 'Home') { e.preventDefault(); switchView('study'); document.getElementById('tab-study').focus(); return; }
    if (e.key === 'End')  { e.preventDefault(); switchView('stats'); document.getElementById('tab-stats').focus(); return; }
  }

  if (currentView !== 'study') return;
  if (!currentCard) return;
  const _c = state.cards[currentCard.id];
  const _isSkipCheck = settings.skipMode && _c.phase === 'new' && !_c.skipTested;
  if (showingDetail) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advanceFromDetail(); }
  } else if (cardStage < 1) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advanceStage(); }
  } else if (_isSkipCheck) {
    if (e.key === '1') rateSkipCheck(false);
    else if (e.key === '2') rateSkipCheck(true);
  } else {
    if (e.key === '1') rate(0);
    else if (e.key === '2') rate(2);
  }
});

loadTheme();
document.getElementById('footer-word-count').textContent = WORDS.length;
render();

// ── 学習カードの自動ポーリング ──
// learningフェーズのカードがdueになったら自動でrenderを呼ぶ
setInterval(() => {
  // currentCardがない（all done / waiting）状態のときだけ
  if (currentCard) return;
  // studyタブが表示中かどうか確認
  const tab = document.getElementById('tab-study');
  if (tab && !tab.classList.contains('active')) return;
  // learning中のdueカードがあれば再描画
  const now = Date.now();
  const hasDue = WORDS.some(w => {
    const c = state.cards[w.id];
    return c.phase === 'learning' && c.due <= now;
  });
  if (hasDue) render();
}, 5000); // 5秒ごとにチェック
</script>
